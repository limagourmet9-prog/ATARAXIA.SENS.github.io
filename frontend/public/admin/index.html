<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"><title>ATARAXIA Vero · Consola del creador</title><style>body{margin:0;background:#080808;color:#eee;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(760px,92vw);padding:28px;border:1px solid #443a20;border-radius:20px;background:#10100e;box-shadow:0 20px 70px #000}.grid{display:grid;gap:12px}input,textarea{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #3e3727;border-radius:10px;padding:12px}textarea{min-height:280px}button{padding:11px 15px;border-radius:10px;border:1px solid #8b6d25;background:#d5af45;color:#090909;font-weight:800;cursor:pointer}.muted{color:#aaa;font-size:13px}.status{padding:10px;border-radius:10px;background:#17150f;margin-top:12px}</style><script src="../ai/config.js"></script></head><body><main class="box"><h1>ATARAXIA Vero</h1><p>Consola del creador · conocimiento de la IA</p><p class="muted">Esta interfaz está preparada para conectarse a un backend seguro. No coloques claves API ni secretos aquí.</p><div id="login" class="grid"><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña de administrador"><button id="enter">Acceder</button></div><section id="app" hidden class="grid"><h2>Base de conocimiento</h2><textarea id="knowledge" spellcheck="false"></textarea><div><button id="load">Cargar</button> <button id="save">Guardar en backend</button> <button id="export">Exportar JSON</button></div><h2>Retroalimentación del creador</h2><textarea id="feedback" placeholder="Escribe aquí correcciones, precios, servicios, restricciones, preguntas frecuentes o criterios que quieras enseñar a ATARAXIA Vero..."></textarea><button id="sendFeedback">Enviar retroalimentación</button><div id="status" class="status">Sin sesión.</div></section></main><script>const API=(window.ATARAXIA_CONFIG?.apiBase||window.ATARAXIA_API_BASE||'').replace(/\/$/,'');const $=id=>document.getElementById(id);async function req(path,opt={}){const r=await fetch(API+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(!r.ok)throw new Error(await r.text()||r.statusText);return r.json()}$('enter').onclick=async()=>{try{await req('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('login').hidden=true;$('app').hidden=false;$('status').textContent='Sesión segura iniciada.';await load()}catch(e){$('status').textContent='No se pudo iniciar sesión.'}};async function load(){try{$('knowledge').value=JSON.stringify(await req('/api/admin/knowledge'),null,2);$('status').textContent='Conocimiento cargado.'}catch(e){$('status').textContent='Backend no configurado o no disponible.'}}$('load').onclick=load;$('save').onclick=async()=>{try{const data=JSON.parse($('knowledge').value);await req('/api/admin/knowledge',{method:'PUT',body:JSON.stringify(data)});$('status').textContent='Conocimiento actualizado y versionado.'}catch(e){$('status').textContent='No se pudo guardar: '+e.message}};$('sendFeedback').onclick=async()=>{try{await req('/api/admin/feedback',{method:'POST',body:JSON.stringify({text:$('feedback').value})});$('feedback').value='';$('status').textContent='Retroalimentación registrada.'}catch(e){$('status').textContent='No se pudo registrar: '+e.message}};$('export').onclick=()=>{const blob=new Blob([$('knowledge').value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ataraxia-ai-knowledge.json';a.click();URL.revokeObjectURL(a.href)}</script></body></html>
