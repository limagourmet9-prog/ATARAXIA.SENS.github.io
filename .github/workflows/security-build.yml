name: Security build check

on:
  pull_request:
    paths:
      - "frontend/**"
      - "supabase/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile=false

      - name: Build
        run: yarn build
